name: "Airtable Inventory to SDC4"
description: "Introspect an Airtable base table, discover matching catalog components, validate and distribute artifacts. Requires: pip install sdc-agents-smb[airtable]"
parameters:
  - name: datasource
    description: "Name of a configured Airtable datasource"
    required: true
steps:
  - agent: introspect
    tool: introspect_airtable
    args:
      datasource_name: "{{ datasource }}"
  - agent: assembly
    tool: discover_components
    args:
      datasource_name: "{{ datasource }}"
  - agent: validation
    tool: validate_batch
    args:
      sign: true
      package: true
  - agent: distribution
    tool: distribute_batch
