name: "Healthcare CSV to SDC4"
description: "Introspect a healthcare CSV with sidecar metadata, discover matching catalog components, validate and distribute artifacts."
parameters:
  - name: datasource
    description: "Name of a configured CSV datasource"
    required: true
steps:
  - agent: introspect
    tool: introspect_csv
    args:
      datasource_name: "{{ datasource }}"
  - agent: assembly
    tool: discover_components
    args:
      datasource_name: "{{ datasource }}"
  - agent: validation
    tool: validate_batch
    args:
      sign: true
      package: true
  - agent: distribution
    tool: distribute_batch
